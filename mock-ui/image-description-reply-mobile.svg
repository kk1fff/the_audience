<svg xmlns="http://www.w3.org/2000/svg" width="375" height="600" viewBox="0 0 375 600" role="img" aria-labelledby="title desc">
  <title id="title">Narrow reply image description editor</title>
  <desc id="desc">A 375 pixel nested reply shows two image cards and a full-width labelled editor for the second image with character count, Cancel, Clear, and Save controls.</desc>
  <rect width="375" height="600" fill="#fff"/>
  <g font-family="Arial, Helvetica, sans-serif" fill="#19212a">
    <path d="M38 24V574" stroke="#e5dff7" stroke-width="2"/>
    <circle cx="70" cy="54" r="16" fill="#8a70ce"/><text x="65" y="60" font-size="14" fill="#fff">M</text>
    <text x="99" y="50" font-size="15" font-weight="bold">Mira</text><text x="99" y="77" font-size="14">That caught my attention.</text>
    <text x="99" y="103" font-size="12" fill="#7865cc">Reply</text>
    <text x="99" y="132" font-size="13" fill="#68717d">Reply to Mira</text>
    <rect x="99" y="143" width="255" height="37" rx="18" fill="#fff" stroke="#dedee6"/><text x="112" y="167" font-size="13" fill="#899099">Write a reply…</text>
    <text x="99" y="207" font-size="13" font-weight="bold">Images <tspan fill="#68717d" font-weight="normal">2 of 4</tspan></text>

    <rect x="99" y="219" width="119" height="153" rx="9" fill="#fff" stroke="#e4e0eb"/>
    <rect x="104" y="224" width="109" height="91" rx="6" fill="#c9d8ba"/><path d="M104 304l30-37 19 18 18-30 42 49z" fill="#6d8f65"/>
    <rect x="150" y="229" width="61" height="23" rx="11" fill="#1d2530"/><text x="158" y="245" font-size="10" fill="#fff">Remove</text>
    <text x="107" y="336" font-size="11" fill="#68717d">1 · initial.png</text><text x="107" y="361" font-size="10" font-weight="bold" fill="#7865cc">Add description</text>

    <rect x="228" y="219" width="126" height="153" rx="9" fill="#fff" stroke="#7865cc" stroke-width="2"/>
    <rect x="233" y="224" width="116" height="91" rx="6" fill="#d5c3ae"/><rect x="257" y="245" width="68" height="64" rx="5" fill="#9f704f"/>
    <rect x="286" y="229" width="61" height="23" rx="11" fill="#1d2530"/><text x="294" y="245" font-size="10" fill="#fff">Remove</text>
    <text x="236" y="336" font-size="11" fill="#68717d">2 · posts.png</text><text x="236" y="361" font-size="10" font-weight="bold" fill="#7865cc">Edit description</text>

    <rect x="99" y="386" width="255" height="165" rx="11" fill="#faf9fc" stroke="#e4dcf5"/>
    <text x="110" y="409" font-size="12" font-weight="bold">Description for image 2</text>
    <text x="110" y="426" font-size="11" fill="#68717d">posts.png</text>
    <rect x="110" y="437" width="233" height="57" rx="7" fill="#fff" stroke="#d4d4de"/>
    <text x="119" y="456" font-size="11">A red door next to flower pots</text>
    <text x="110" y="514" font-size="11" fill="#68717d">30 / 1000 characters</text>
    <text x="110" y="537" font-size="11" font-weight="bold" fill="#7865cc">Clear</text>
    <text x="221" y="537" font-size="11" font-weight="bold" fill="#7865cc">Cancel</text>
    <rect x="283" y="518" width="60" height="26" rx="13" fill="#7964d0"/><text x="301" y="536" font-size="11" font-weight="bold" fill="#fff">Save</text>
    <text x="99" y="578" font-size="12" fill="#7865cc">＋ Add images</text>
    <rect x="282" y="557" width="72" height="32" rx="16" fill="#7964d0"/><text x="303" y="578" font-size="12" font-weight="bold" fill="#fff">Send</text>
  </g>
</svg>
