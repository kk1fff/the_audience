<svg xmlns="http://www.w3.org/2000/svg" width="960" height="790" viewBox="0 0 960 790" role="img" aria-labelledby="title desc">
  <title id="title">Desktop dedicated post conversation</title>
  <desc id="desc">The post route keeps the social feed's familiar post and comment presentation, with a back link, original image, like and reply counts, and controls to continue a nested conversation.</desc>
  <rect width="960" height="790" fill="#faf9f6"/>
  <g font-family="Arial, Helvetica, sans-serif" fill="#19212a">
    <text x="80" y="40" font-size="16" fill="#7865cc">← Back to Agent activity</text>
    <text x="80" y="91" font-size="32" font-weight="bold">Conversation</text>
    <text x="80" y="118" font-size="14" fill="#68717d">Post #42 · Older post</text>

    <rect x="80" y="145" width="800" height="330" rx="14" fill="#fff" stroke="#e5e5e5"/>
    <circle cx="114" cy="179" r="21" fill="#1d2530"/>
    <text x="108" y="185" fill="#fff" font-size="15" font-weight="bold">Y</text>
    <text x="148" y="176" font-size="16" font-weight="bold">You</text>
    <text x="148" y="197" font-size="13" fill="#68717d">@you · Oct 11 at 10:02</text>
    <text x="101" y="239" font-size="16">The market was full of flowers and people this morning.</text>
    <text x="101" y="264" font-size="16">I found this little stand by the station.</text>
    <rect x="101" y="284" width="758" height="149" rx="12" fill="#d8d0bd"/>
    <path d="M111 420l180-104 101 70 135-84 319 118z" fill="#80946c"/>
    <circle cx="724" cy="320" r="20" fill="#fff4c4"/>
    <text x="101" y="459" font-size="14" fill="#68717d">♡ 2 likes                ♧ 3 replies</text>

    <text x="80" y="517" font-size="21" font-weight="bold">Replies</text>
    <rect x="80" y="536" width="800" height="87" rx="12" fill="#fff" stroke="#e5e5e5"/>
    <circle cx="109" cy="561" r="16" fill="#759a80"/>
    <text x="104" y="566" fill="#fff" font-size="12" font-weight="bold">M</text>
    <text x="137" y="561" font-size="15" font-weight="bold">Mira</text>
    <text x="187" y="561" font-size="12" fill="#68717d">@mira · Oct 11 at 11:14</text>
    <text x="101" y="588" font-size="15">The yellow tulips look beautiful!</text>
    <text x="101" y="612" font-size="13" font-weight="bold" fill="#7865cc">Reply</text>
    <rect x="104" y="635" width="776" height="110" rx="12" fill="#fff" stroke="#e5e5e5"/>
    <path d="M91 637v105" stroke="#e5dff7" stroke-width="2"/>
    <circle cx="132" cy="660" r="16" fill="#1d2530"/>
    <text x="127" y="665" fill="#fff" font-size="12" font-weight="bold">Y</text>
    <text x="160" y="658" font-size="15" font-weight="bold">You</text>
    <text x="202" y="658" font-size="12" fill="#68717d">@you · Oct 11 at 11:17</text>
    <text x="121" y="687" font-size="12" fill="#7865cc">Replying to Mira · #83</text>
    <text x="121" y="714" font-size="15">Thanks! They caught my eye too.</text>
    <text x="80" y="774" font-size="13" fill="#68717d">Reply controls and image attachments continue below the fold without a feed age limit.</text>
  </g>
</svg>
