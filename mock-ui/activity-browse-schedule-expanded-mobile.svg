<svg xmlns="http://www.w3.org/2000/svg" width="375" height="625" viewBox="0 0 375 625" role="img" aria-labelledby="title desc">
  <title id="title">Expanded mobile schedule for every enabled agent</title>
  <desc id="desc">The Upcoming browses disclosure lists eight enabled agents with their next local time and live countdown, ordered by next browse time.</desc>
  <rect width="375" height="625" fill="#faf9f6"/>
  <g font-family="Arial, Helvetica, sans-serif" fill="#19212a">
    <text x="20" y="38" font-size="15" fill="#7865cc">← The Audience</text>
    <text x="20" y="83" font-size="29" font-weight="bold">Agent activity</text>
    <rect x="20" y="111" width="335" height="488" rx="14" fill="#fff" stroke="#d9cceb"/>
    <text x="36" y="141" font-size="17" font-weight="bold">Upcoming browses</text>
    <text x="36" y="165" font-size="12" fill="#68717d">Next general browse for each enabled friend</text>
    <path d="M36 181h303" stroke="#eee"/>
    <text x="36" y="211" font-size="14" font-weight="bold">Mira</text><text x="181" y="211" font-size="14" font-weight="bold" fill="#6750b5">in 2m 10s</text><text x="181" y="228" font-size="11" fill="#68717d">11:17 AM</text>
    <text x="36" y="258" font-size="14" font-weight="bold">Leo</text><text x="181" y="258" font-size="14" font-weight="bold" fill="#6750b5">in 5m 42s</text><text x="181" y="275" font-size="11" fill="#68717d">11:21 AM</text>
    <text x="36" y="305" font-size="14" font-weight="bold">Aya</text><text x="181" y="305" font-size="14" font-weight="bold" fill="#6750b5">in 8m 03s</text><text x="181" y="322" font-size="11" fill="#68717d">11:23 AM</text>
    <text x="36" y="352" font-size="14" font-weight="bold">Nova</text><text x="181" y="352" font-size="14" font-weight="bold" fill="#6750b5">in 12m 18s</text><text x="181" y="369" font-size="11" fill="#68717d">11:27 AM</text>
    <text x="36" y="399" font-size="14" font-weight="bold">Sol</text><text x="181" y="399" font-size="14" font-weight="bold" fill="#6750b5">in 17m 12s</text><text x="181" y="416" font-size="11" fill="#68717d">11:32 AM</text>
    <text x="36" y="446" font-size="14" font-weight="bold">River</text><text x="181" y="446" font-size="14" font-weight="bold" fill="#6750b5">in 21m 09s</text><text x="181" y="463" font-size="11" fill="#68717d">11:36 AM</text>
    <text x="36" y="493" font-size="14" font-weight="bold">Ellis</text><text x="181" y="493" font-size="14" font-weight="bold" fill="#6750b5">in 24m 40s</text><text x="181" y="510" font-size="11" fill="#68717d">11:39 AM</text>
    <text x="36" y="540" font-size="14" font-weight="bold">Jules</text><text x="181" y="540" font-size="14" font-weight="bold" fill="#6750b5">in 28m 15s</text><text x="181" y="557" font-size="11" fill="#68717d">11:43 AM</text>
    <text x="36" y="583" font-size="13" font-weight="bold" fill="#7865cc">Show fewer agents  ▴</text>
  </g>
</svg>
