<svg xmlns="http://www.w3.org/2000/svg" width="620" height="620" viewBox="0 0 620 620" role="img" aria-labelledby="title desc">
  <title id="title">Desktop post composer with per-photo descriptions</title>
  <desc id="desc">Four image cards keep the picker layout. One card has a saved description, another is being described in a labelled editor below the grid.</desc>
  <rect width="620" height="620" fill="#fff"/>
  <g font-family="Arial, Helvetica, sans-serif" fill="#19212a">
    <text x="25" y="42" font-size="22" font-weight="bold">Home</text><text x="25" y="63" font-size="13" font-weight="bold" fill="#7865cc">For you</text>
    <path d="M0 84H620" stroke="#e8e8e5"/>
    <circle cx="45" cy="120" r="20" fill="#1d2530"/><text x="38" y="127" font-size="17" fill="#fff">Y</text>
    <text x="79" y="121" font-size="18">Today I walked through the market…</text>
    <text x="79" y="170" font-size="14" font-weight="bold">Images <tspan fill="#68717d" font-weight="normal">4 of 4</tspan></text>
    <text x="497" y="170" font-size="13" fill="#92949b">Limit reached</text>

    <rect x="79" y="184" width="112" height="174" rx="10" fill="#fff" stroke="#e4e0eb"/>
    <rect x="84" y="189" width="102" height="96" rx="7" fill="#c9d8ba"/><path d="M84 276l27-34 20 20 21-31 34 45z" fill="#6d8f65"/>
    <rect x="126" y="195" width="58" height="22" rx="11" fill="#1d2530"/><text x="134" y="210" font-size="11" fill="#fff">Remove</text>
    <text x="88" y="305" font-size="12" fill="#68717d">1 · initial.png</text>
    <text x="88" y="325" font-size="10" fill="#28784d">Description added</text>
    <text x="88" y="346" font-size="11" font-weight="bold" fill="#7865cc">Edit description</text>

    <rect x="203" y="184" width="112" height="174" rx="10" fill="#fff" stroke="#7865cc" stroke-width="2"/>
    <rect x="208" y="189" width="102" height="96" rx="7" fill="#d5c3ae"/><rect x="228" y="210" width="60" height="68" rx="5" fill="#9f704f"/>
    <rect x="250" y="195" width="58" height="22" rx="11" fill="#1d2530"/><text x="258" y="210" font-size="11" fill="#fff">Remove</text>
    <text x="212" y="305" font-size="12" fill="#68717d">2 · posts.png</text>
    <text x="212" y="346" font-size="11" font-weight="bold" fill="#7865cc">Add description</text>

    <rect x="327" y="184" width="112" height="174" rx="10" fill="#fff" stroke="#e4e0eb"/>
    <rect x="332" y="189" width="102" height="96" rx="7" fill="#c9d8e6"/><circle cx="383" cy="241" r="26" fill="#dfb376"/>
    <rect x="374" y="195" width="58" height="22" rx="11" fill="#1d2530"/><text x="382" y="210" font-size="11" fill="#fff">Remove</text>
    <text x="336" y="305" font-size="12" fill="#68717d">3 · post-image…</text>
    <text x="336" y="346" font-size="11" font-weight="bold" fill="#7865cc">Add description</text>

    <rect x="451" y="184" width="112" height="174" rx="10" fill="#fff" stroke="#e4e0eb"/>
    <rect x="456" y="189" width="102" height="96" rx="7" fill="#dfd6ec"/><path d="M463 270h88m-88-18h88m-88-18h60" stroke="#816aab" stroke-width="4"/>
    <rect x="498" y="195" width="58" height="22" rx="11" fill="#1d2530"/><text x="506" y="210" font-size="11" fill="#fff">Remove</text>
    <text x="460" y="305" font-size="12" fill="#68717d">4 · activity…</text>
    <text x="460" y="346" font-size="11" font-weight="bold" fill="#7865cc">Add description</text>

    <rect x="79" y="371" width="484" height="171" rx="12" fill="#faf9fc" stroke="#e4dcf5"/>
    <text x="93" y="394" font-size="14" font-weight="bold">Description for image 2 · posts.png</text>
    <text x="93" y="414" font-size="12" fill="#68717d">Describe what matters in this photo for people who cannot see it.</text>
    <rect x="93" y="425" width="456" height="69" rx="8" fill="#fff" stroke="#d4d4de"/>
    <text x="104" y="448" font-size="13" fill="#899099">E.g., a flower stall with yellow tulips at the market</text>
    <text x="93" y="516" font-size="12" fill="#68717d">0 / 1000 characters</text>
    <text x="393" y="519" font-size="13" font-weight="bold" fill="#7865cc">Cancel</text>
    <rect x="464" y="502" width="85" height="31" rx="16" fill="#7964d0"/><text x="492" y="523" font-size="13" font-weight="bold" fill="#fff">Save</text>
    <text x="79" y="587" font-size="13" fill="#899099">262/280 · 4/4 images</text>
    <rect x="510" y="563" width="84" height="38" rx="19" fill="#7964d0"/><text x="535" y="588" font-size="14" font-weight="bold" fill="#fff">Post</text>
  </g>
</svg>
