<svg xmlns="http://www.w3.org/2000/svg" width="620" height="480" viewBox="0 0 620 480" role="img" aria-labelledby="title desc">
  <title id="title">Desktop post composer with four ordered image previews</title>
  <desc id="desc">Four thumbnails are shown in upload order, each with a remove control and short filename; the picker says four of four images and the add control is unavailable at the limit.</desc>
  <rect width="620" height="480" fill="#fff"/>
  <g font-family="Arial, Helvetica, sans-serif" fill="#19212a">
    <text x="25" y="42" font-size="22" font-weight="bold">Home</text>
    <text x="25" y="63" font-size="13" font-weight="bold" fill="#7865cc">For you</text>
    <path d="M0 84H620" stroke="#e8e8e5"/>
    <circle cx="45" cy="120" r="20" fill="#1d2530"/>
    <text x="38" y="127" font-size="17" fill="#fff">Y</text>
    <text x="79" y="118" font-size="18">Today I walked through the market and spotted</text>
    <text x="79" y="141" font-size="18">a tiny flower stall…</text>
    <text x="79" y="178" font-size="14" font-weight="bold">Images <tspan fill="#68717d" font-weight="normal">4 of 4</tspan></text>
    <text x="497" y="178" font-size="13" fill="#92949b">Limit reached</text>

    <rect x="79" y="192" width="112" height="147" rx="10" fill="#f6f4fa" stroke="#e4e0eb"/>
    <rect x="84" y="197" width="102" height="105" rx="7" fill="#c9d8ba"/>
    <path d="M84 290l31-43 18 21 20-34 33 56z" fill="#6d8f65"/>
    <rect x="126" y="202" width="58" height="22" rx="11" fill="#1d2530"/><text x="134" y="217" font-size="11" fill="#fff">Remove</text>
    <text x="88" y="322" font-size="12" fill="#68717d">1 · initial.png</text>

    <rect x="203" y="192" width="112" height="147" rx="10" fill="#f6f4fa" stroke="#e4e0eb"/>
    <rect x="208" y="197" width="102" height="105" rx="7" fill="#d5c3ae"/>
    <rect x="227" y="219" width="60" height="70" rx="5" fill="#9f704f"/>
    <rect x="250" y="202" width="58" height="22" rx="11" fill="#1d2530"/><text x="258" y="217" font-size="11" fill="#fff">Remove</text>
    <text x="212" y="322" font-size="12" fill="#68717d">2 · posts.png</text>

    <rect x="327" y="192" width="112" height="147" rx="10" fill="#f6f4fa" stroke="#e4e0eb"/>
    <rect x="332" y="197" width="102" height="105" rx="7" fill="#c9d8e6"/>
    <circle cx="383" cy="250" r="27" fill="#dfb376"/>
    <rect x="374" y="202" width="58" height="22" rx="11" fill="#1d2530"/><text x="382" y="217" font-size="11" fill="#fff">Remove</text>
    <text x="336" y="322" font-size="12" fill="#68717d">3 · post-image…</text>

    <rect x="451" y="192" width="112" height="147" rx="10" fill="#f6f4fa" stroke="#e4e0eb"/>
    <rect x="456" y="197" width="102" height="105" rx="7" fill="#dfd6ec"/>
    <path d="M463 286h88m-88-18h88m-88-18h60" stroke="#816aab" stroke-width="4"/>
    <rect x="498" y="202" width="58" height="22" rx="11" fill="#1d2530"/><text x="506" y="217" font-size="11" fill="#fff">Remove</text>
    <text x="460" y="322" font-size="12" fill="#68717d">4 · activity…</text>

    <path d="M79 358H595" stroke="#eee"/>
    <text x="373" y="391" font-size="13" fill="#899099">262/280 · 4/4 images</text>
    <rect x="510" y="369" width="84" height="38" rx="19" fill="#7964d0"/>
    <text x="535" y="394" font-size="14" font-weight="bold" fill="#fff">Post</text>
    <text x="79" y="441" font-size="12" fill="#68717d">Remove any image to make room for another.</text>
  </g>
</svg>
