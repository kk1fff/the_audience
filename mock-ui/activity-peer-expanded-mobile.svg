    <text x="210" y="662" font-size="12" font-weight="bold" fill="#6750b5">Peer notification</text>
    <text x="44" y="690" font-size="15" font-weight="bold" fill="#68717d">Ignored · stopped following</text>
    <text x="44" y="713" font-size="12" fill="#68717d">From Mira's reply · comment #84</text>
    <text x="44" y="735" font-size="12" fill="#68717d">Delivered · Aya remains stopped</text>
    <text x="44" y="757" font-size="12" fill="#68717d">Only your @mention can reactivate this thread.</text>
    <text x="44" y="800" font-size="13" font-weight="bold" fill="#6750b5" text-decoration="underline">Open Mira's reply →</text>
