<svg xmlns="http://www.w3.org/2000/svg" width="375" height="650" viewBox="0 0 375 650" role="img" aria-labelledby="title desc">
  <title id="title">Mobile post composer with saved and empty photo descriptions</title>
  <desc id="desc">At 375 pixels two image cards have separate description actions; the first shows a saved state and the second offers Add description without expanding the composer.</desc>
  <rect width="375" height="650" fill="#fff"/>
  <g font-family="Arial, Helvetica, sans-serif" fill="#19212a">
    <rect width="375" height="55" fill="#faf9f6"/><text x="20" y="36" font-size="25" fill="#7865cc">✦</text><text x="336" y="35" font-size="19">Y</text>
    <path d="M0 55H375" stroke="#e8e8e5"/>
    <text x="25" y="94" font-size="21" font-weight="bold">Home</text><text x="25" y="116" font-size="13" font-weight="bold" fill="#7865cc">For you</text>
    <path d="M0 132H375" stroke="#eee"/>
    <circle cx="36" cy="164" r="18" fill="#1d2530"/><text x="30" y="170" font-size="16" fill="#fff">Y</text>
    <text x="68" y="164" font-size="17">Today I walked through the market…</text>
    <text x="68" y="205" font-size="14" font-weight="bold">Images <tspan fill="#68717d" font-weight="normal">2 of 4</tspan></text>
    <text x="254" y="205" font-size="13" font-weight="bold" fill="#7865cc">＋ Add images</text>

    <rect x="68" y="218" width="134" height="190" rx="10" fill="#fff" stroke="#e4e0eb"/>
    <rect x="73" y="223" width="124" height="112" rx="7" fill="#c9d8ba"/><path d="M73 325l35-43 22 20 26-36 41 59z" fill="#6d8f65"/>
    <rect x="131" y="229" width="63" height="24" rx="12" fill="#1d2530"/><text x="139" y="245" font-size="11" fill="#fff">Remove</text>
    <text x="78" y="354" font-size="12" fill="#68717d">1 · initial.png</text>
    <text x="78" y="373" font-size="10" fill="#28784d">Description added</text>
    <text x="78" y="396" font-size="11" font-weight="bold" fill="#7865cc">Edit description</text>

    <rect x="212" y="218" width="134" height="190" rx="10" fill="#fff" stroke="#e4e0eb"/>
    <rect x="217" y="223" width="124" height="112" rx="7" fill="#d5c3ae"/><rect x="240" y="246" width="78" height="80" rx="5" fill="#9f704f"/>
    <rect x="275" y="229" width="63" height="24" rx="12" fill="#1d2530"/><text x="283" y="245" font-size="11" fill="#fff">Remove</text>
    <text x="222" y="354" font-size="12" fill="#68717d">2 · posts.png</text>
    <text x="222" y="396" font-size="11" font-weight="bold" fill="#7865cc">Add description</text>

    <path d="M68 429H346" stroke="#eee"/>
    <text x="119" y="463" font-size="13" fill="#899099">48/280 · 2/4 images</text>
    <rect x="270" y="438" width="76" height="38" rx="19" fill="#7964d0"/><text x="292" y="463" font-size="14" font-weight="bold" fill="#fff">Post</text>
    <path d="M0 505H375" stroke="#eee"/>
    <text x="25" y="541" font-size="16" font-weight="bold">Your timeline ✦</text>
  </g>
</svg>
