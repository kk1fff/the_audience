<svg xmlns="http://www.w3.org/2000/svg" width="960" height="1030" viewBox="0 0 960 1030" role="img" aria-labelledby="title desc"><title id="title">Background diagnostic, desktop, outage</title><desc id="desc">Expanded Activity diagnostic showing local time, weather, news, and search provenance for a outage background bundle.</desc><g font-family="Arial, sans-serif">
<rect x="0" y="0" width="960" height="1030" rx="0" fill="#f7f7fa" stroke="#f7f7fa"/>
